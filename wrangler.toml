name = "hydrart-tattoo"
compatibility_date = "2026-09-01"

# Publicar el sitio desde la raíz del proyecto, pero nunca subir metadatos
# internos del repositorio ni archivos de desarrollo como assets públicos.
[assets]
directory = "."
# Lista blanca: solo estos archivos forman parte del sitio publicado.
include = [
  "index.html",
  "assets/**"
]
